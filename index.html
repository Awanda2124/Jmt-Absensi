function toast(message, type = 'info') {

    toastHost.className = 'pointer-events-none fixed inset-x-0 top-3 z-50 flex flex-col items-center gap-2 px-4';

// Modal: bottom sheet di HP, kotak di tengah di desktop. Esc / klik latar / tombol X untuk menutup.
// onMount(body, close) dipanggil setelah modal tampil. onClose() dipanggil saat modal tertutup.
function openModal({ title, content, onMount, onClose }) {
  const prevFocus = document.activeElement;
  const host = document.createElement('div');
  host.className = 'fixed inset-0 z-40 flex items-end justify-center bg-slate-900/40 sm:items-center sm:p-4';
  host.innerHTML = `
    <div role="dialog" aria-modal="true" aria-labelledby="modal-title"
         class="w-full max-w-md rounded-t-2xl bg-white shadow-xl sm:rounded-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <h2 id="modal-title" class="text-base font-semibold text-slate-900">${esc(title)}</h2>
        <button type="button" data-close aria-label="Tutup"
                class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-50 hover:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
          ${icon('x', 'size-5')}
        </button>
      </div>
      <div data-body class="max-h-[80dvh] overflow-y-auto px-5 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]">${content}</div>
    </div>`;
  document.body.appendChild(host);
  document.body.classList.add('overflow-hidden');

  let closed = false;
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() {
    if (closed) return;
    closed = true;
    document.removeEventListener('keydown', onKey);
    host.remove();
    document.body.classList.remove('overflow-hidden');
    if (prevFocus && typeof prevFocus.focus === 'function') prevFocus.focus();
    if (onClose) onClose();
  }
  document.addEventListener('keydown', onKey);
  host.addEventListener('mousedown', (e) => { if (e.target === host) close(); });
  host.querySelector('[data-close]').addEventListener('click', close);

  const body = host.querySelector('[data-body]');
  if (onMount) onMount(body, close);
  const first = body.querySelector('input, button, select, textarea');
  if (first) first.focus();
  return close;
}

// Dialog konfirmasi. Resolve true kalau user menekan tombol konfirmasi, false kalau batal/ditutup.
function confirmDialog({ title, message, confirmLabel = 'Ya', danger = false }) {
  return new Promise((resolve) => {
    let decided = false;
    openModal({
      title,
      content: `
        <p class="text-sm text-slate-600">${esc(message)}</p>
        <div class="mt-5 flex gap-2">
          <button type="button" data-no class="${BTN_GHOST} flex-1">Batal</button>
          <button type="button" data-yes class="${danger ? BTN_DANGER : BTN_PRIMARY} flex-1">${esc(confirmLabel)}</button>
        </div>`,
      onMount: (body, close) => {
        body.querySelector('[data-no]').addEventListener('click', close);
        body.querySelector('[data-yes]').addEventListener('click', () => {
          decided = true;
          resolve(true);
          close();
        });
      },
      onClose: () => { if (!decided) resolve(false); },
    });
  });
}

// Panggil Edge Function admin-users (hanya berhasil untuk super admin).
// Melempar Error dengan pesan dari server kalau gagal.
async function callAdminFn(body) {
  const { data, error } = await supabase.functions.invoke('admin-users', { body });
  if (error) {
    let msg = 'Gagal menghubungi server.';
    if (error.name === 'FunctionsFetchError') {
      msg = 'Tidak bisa terhubung ke server. Periksa koneksi internet.';
    } else {
      try {
        const res = error.context; // Response untuk FunctionsHttpError
        if (res && typeof res.json === 'function') {
          const j = await res.json();
          if (j && j.error) msg = String(j.error);
        }
      } catch {
        /* pakai pesan default */
      }
    }
    throw new Error(msg);
  }
  return data;
}

// Return { session: null, profile: null } kalau belum login.
// profile = null kalau sudah login tapi belum punya baris di public.profiles.
async function loadSession() {
  const { data, error: sessionError } = await supabase.auth.getSession();
  if (sessionError) throw sessionError;
  const session = data.session;
  if (!session) return { session: null, profile: null };

  const { data: profile, error } = await supabase
    .from('profiles')
    .select('id, full_name, role, is_active')
    .eq('id', session.user.id)
    .maybeSingle();
  if (error) throw error;

  return { session, profile };
}

// Hash router sederhana (cocok untuk GitHub Pages, tanpa konfigurasi server).
let onHashChange = null;

function stopRouter() {
  if (onHashChange) window.removeEventListener('hashchange', onHashChange);
  onHashChange = null;
}

function startRouter({ items, ctx, view, onNavigate }) {
  stopRouter();

  async function resolve() {
    const path = location.hash.replace(/^#/, '');
    const item = items.find((i) => i.path === path);

    // Path tidak dikenal atau bukan jatah role ini -> arahkan ke menu pertama
    if (!item) {
      location.replace(`#${items[0].path}`);
      return;
    }

    onNavigate(item);
    view.replaceChildren();
    try {
      await item.render(view, ctx);
    } catch (e) {
      console.error(e);
      view.innerHTML =
        '<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">Halaman gagal dimuat. Coba muat ulang.</div>';
    }
    window.scrollTo(0, 0);
  }

  onHashChange = resolve;
  window.addEventListener('hashchange', onHashChange);
  resolve();
}

// --- Login ---
function friendlyLoginError(error) {
  const msg = String(error?.message ?? '');
  if (error?.status === 429) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/invalid login credentials/i.test(msg)) return 'Email atau password salah.';
  if (/email not confirmed/i.test(msg)) return 'Email belum dikonfirmasi. Hubungi super admin.';
  if (error?.name === 'AuthRetryableFetchError' || /failed to fetch|network/i.test(msg)) {
    return 'Tidak bisa terhubung ke server. Periksa koneksi internet.';
  }
  return 'Gagal masuk. Coba lagi.';
}

  const form = root.querySelector('#login-form');
  const emailEl = form.elements.email;
  const passEl = form.elements.password;
  const errorEl = root.querySelector('#login-error');
  const submitEl = root.querySelector('#login-submit');
  const labelEl = root.querySelector('#login-label');
  const spinnerEl = root.querySelector('#login-spinner');
  const toggleEl = root.querySelector('#toggle-pw');

  const setError = (msg) => {
    errorEl.textContent = msg;
    errorEl.classList.toggle('hidden', !msg);

  const setLoading = (on) => {
    submitEl.disabled = on;
    spinnerEl.classList.toggle('hidden', !on);
    labelEl.textContent = on ? 'Memproses…' : 'Masuk';
  };

  toggleEl.addEventListener('click', () => {

// --- Leader (super admin): kelola akun leader ---
function friendlyAdminError(msg) {
  if (/already (been )?registered|already exists|duplicate/i.test(msg)) return 'Email sudah terdaftar.';
  if (/forbidden/i.test(msg)) return 'Akses ditolak. Hanya super admin yang boleh.';
  if (/unauthorized|invalid jwt/i.test(msg)) return 'Sesi habis. Silakan login ulang.';
  return msg;
}

// Password acak 12 karakter (tanpa karakter yang mirip: 0/O, 1/l/I)
function generatePassword(len = 12) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const buf = new Uint32Array(len);
  crypto.getRandomValues(buf);
  let out = '';
  for (const n of buf) out += chars[n % chars.length];
  return out;
}

      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-slate-900">${esc(l.full_name)}</p>
          <p class="truncate text-sm text-slate-500">${esc(l.email || '—')}</p>
        </div>
        <span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium ${l.is_active ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${l.is_active ? 'Aktif' : 'Nonaktif'}</span>
      </div>
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" data-act="reset" data-id="${esc(l.id)}" class="${BTN_SM}">Reset password</button>
        <button type="button" data-act="toggle" data-id="${esc(l.id)}" class="${BTN_SM}">${l.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
      </div>
    </li>`;

  const renderList = () => {
    if (!leaders.length) {
      listEl.innerHTML = `
        <div class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center">
          <p class="text-sm font-medium text-slate-900">Belum ada leader</p>
          <p class="mt-1 text-sm text-slate-500">Klik Tambah untuk membuat akun leader pertama.</p>
        </div>`;
      return;
    }
    listEl.innerHTML = `<ul class="space-y-3">${leaders.map(card).join('')}</ul>`;
  };

  async function load() {
    listEl.innerHTML = '<p class="py-10 text-center text-sm text-slate-400">Memuat…</p>';
    const { data, error } = await supabase
      .from('profiles')
      .select('id, full_name, email, is_active')
      .eq('role', 'leader')
      .order('full_name');
    if (error) {
      console.error(error);
      listEl.innerHTML = `
        <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
          Gagal memuat daftar leader.
          <button type="button" data-act="retry" class="font-medium underline">Coba lagi</button>
        </div>`;
      return;
    }
    leaders = data ?? [];
    renderList();
  }

  // --- Tambah leader ---
  function openAddModal() {
    openModal({
      title: 'Tambah leader',
      content: `
        <form id="add-form" novalidate class="space-y-4">
          <div>
            <label for="f-name" class="${LABEL}">Nama lengkap</label>
            <input id="f-name" name="full_name" type="text" maxlength="100" autocomplete="off" class="${INPUT}">
          </div>
          <div>
            <label for="f-email" class="${LABEL}">Email login</label>
            <input id="f-email" name="email" type="email" inputmode="email" autocomplete="off"
                   autocapitalize="none" spellcheck="false" placeholder="nama@perusahaan.com" class="${INPUT}">
          </div>
          <div>
            <label for="f-pass" class="${LABEL}">Password awal</label>
            <div class="flex gap-2">
              <input id="f-pass" name="password" type="text" autocomplete="off" spellcheck="false"
                     value="${esc(generatePassword())}" class="${INPUT} font-mono">
              <button type="button" data-gen class="${BTN_SM} shrink-0">Acak</button>
            </div>
            <p class="mt-1.5 text-xs text-slate-500">Minimal 8 karakter.</p>
          </div>
          <p data-error role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <button type="submit" class="${SUBMIT_CLS}">Buat akun</button>
        </form>`,
      onMount: (body, close) => {
        const form = body.querySelector('#add-form');
        const errEl = body.querySelector('[data-error]');
        const btn = form.querySelector('[type="submit"]');
        const setError = (m) => { errEl.textContent = m; errEl.classList.toggle('hidden', !m); };

        body.querySelector('[data-gen]').addEventListener('click', () => {
          form.elements.password.value = generatePassword();
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (btn.disabled) return;
          const full_name = form.elements.full_name.value.trim();
          const email = form.elements.email.value.trim().toLowerCase();
          const password = form.elements.password.value;

          if (!full_name) return setError('Nama wajib diisi.');
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setError('Format email tidak valid.');
          if (password.length < 8) return setError('Password minimal 8 karakter.');

          setError('');
          btn.disabled = true;
          btn.textContent = 'Memproses…';
          try {
            await callAdminFn({ action: 'create_leader', full_name, email, password });
          } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Buat akun';
            setError(friendlyAdminError(err.message));
            return;
          }
          close();
          showCredentials({ title: 'Akun leader dibuat', name: full_name, email, password });
          load();
        });
      },
    });
  }

  // --- Reset password ---
  function openResetModal(leader) {
    openModal({
      title: 'Reset password',
      content: `
        <form id="reset-form" novalidate class="space-y-4">
          <p class="text-sm text-slate-500">Password baru untuk <span class="font-medium text-slate-900">${esc(leader.full_name)}</span>.</p>
          <div>
            <label for="f-pass" class="${LABEL}">Password baru</label>
            <div class="flex gap-2">
              <input id="f-pass" name="password" type="text" autocomplete="off" spellcheck="false"
                     value="${esc(generatePassword())}" class="${INPUT} font-mono">
              <button type="button" data-gen class="${BTN_SM} shrink-0">Acak</button>
            </div>
            <p class="mt-1.5 text-xs text-slate-500">Minimal 8 karakter.</p>
          </div>
          <p data-error role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <button type="submit" class="${SUBMIT_CLS}">Simpan password</button>
        </form>`,
      onMount: (body, close) => {
        const form = body.querySelector('#reset-form');
        const errEl = body.querySelector('[data-error]');
        const btn = form.querySelector('[type="submit"]');
        const setError = (m) => { errEl.textContent = m; errEl.classList.toggle('hidden', !m); };

        body.querySelector('[data-gen]').addEventListener('click', () => {
          form.elements.password.value = generatePassword();
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (btn.disabled) return;
          const password = form.elements.password.value;
          if (password.length < 8) return setError('Password minimal 8 karakter.');

          setError('');
          btn.disabled = true;
          btn.textContent = 'Memproses…';
          try {
            await callAdminFn({ action: 'reset_password', user_id: leader.id, password });
          } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Simpan password';
            setError(friendlyAdminError(err.message));
            return;
          }
          close();
          showCredentials({ title: 'Password direset', name: leader.full_name, email: leader.email, password });
        });
      },
    });
  }

  // --- Aktif / nonaktif ---
  // Nonaktif langsung memutus akses data (RLS memeriksa is_active), dan login akan ditolak aplikasi.
  async function toggleActive(leader) {
    const next = !leader.is_active;
    const ok = await confirmDialog({
      title: next ? 'Aktifkan leader?' : 'Nonaktifkan leader?',
      message: next
        ? `${leader.full_name} bisa login dan mengisi absensi lagi.`
        : `${leader.full_name} tidak bisa login dan tidak bisa mengakses data. Data absensi tetap tersimpan.`,
      confirmLabel: next ? 'Aktifkan' : 'Nonaktifkan',
      danger: !next,
    });
    if (!ok) return;

    // .select() supaya kelihatan kalau RLS menolak diam-diam (0 baris berubah)
    const { data, error } = await supabase
      .from('profiles')
      .update({ is_active: next })
      .eq('id', leader.id)
      .select('id');
    if (error || !data || data.length === 0) {
      console.error(error);
      toast('Gagal mengubah status.', 'error');
      return;
    }
    leader.is_active = next;
    renderList();
    toast(next ? 'Leader diaktifkan.' : 'Leader dinonaktifkan.', 'success');
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'retry') return load();
    const leader = leaders.find((l) => l.id === btn.dataset.id);
    if (!leader) return;
    if (act === 'reset') openResetModal(leader);
    else if (act === 'toggle') toggleActive(leader);
  });
  view.querySelector('#btn-add').addEventListener('click', openAddModal);

  await load();
}

// --- Helper error database ---
function dbMessage(error, map = {}) {
  if (error?.code && map[error.code]) return map[error.code];
  if (/failed to fetch|network/i.test(String(error?.message ?? ''))) {
    return 'Tidak bisa terhubung ke server. Periksa koneksi internet.';
  }
  return 'Terjadi kesalahan. Coba lagi.';
}

const BADGE_ON = 'bg-emerald-50 text-emerald-700';
const BADGE_OFF = 'bg-slate-100 text-slate-500';
const errBox = (msg, retry = true) => `
  <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
    ${esc(msg)}${retry ? ' <button type="button" data-act="retry" class="font-medium underline">Coba lagi</button>' : ''}
  </div>`;

// --- Bagian (leader): data master bagian ---
const DEPT_ERR = {
  '23505': 'Nama bagian sudah ada.',
  '23503': 'Bagian masih dipakai karyawan. Pindahkan karyawannya dulu.',
  '42501': 'Akses ditolak.',
};

async function pageBagian(view, ctx) {
  const leaderId = ctx.profile.id;
  let rows = [];

  view.innerHTML = `
    <div class="mx-auto max-w-3xl">
      <div class="mb-4 flex items-center justify-between gap-3">
        <p class="text-sm text-slate-500">Bagian tempat karyawan ditempatkan.</p>
        <button type="button" id="btn-add" class="${BTN_PRIMARY} flex shrink-0 items-center gap-1.5">${icon('plus', 'size-4')}Tambah</button>
      </div>
      <div id="dept-list" aria-live="polite"></div>
    </div>`;
  const listEl = view.querySelector('#dept-list');

  const card = (d) => {
    const n = d.employees?.[0]?.count ?? 0;
    return `
    <li class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-slate-900">${esc(d.name)}</p>
          <p class="text-sm text-slate-500">${n} karyawan</p>
        </div>
        <div class="flex shrink-0 gap-2">
          <button type="button" data-act="edit" data-id="${esc(d.id)}" class="${BTN_SM}">Ubah</button>
          <button type="button" data-act="delete" data-id="${esc(d.id)}" class="${BTN_SM}${n > 0 ? ' cursor-not-allowed opacity-50' : ''}"${n > 0 ? ' disabled title="Masih ada karyawan di bagian ini"' : ''}>Hapus</button>
        </div>
      </div>
    </li>`;
  };

  const renderList = () => {
    if (!rows.length) {
      listEl.innerHTML = `
        <div class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center">
          <p class="text-sm font-medium text-slate-900">Belum ada bagian</p>
          <p class="mt-1 text-sm text-slate-500">Buat bagian dulu, baru karyawan bisa ditambahkan.</p>
        </div>`;
      return;
    }
    listEl.innerHTML = `<ul class="space-y-3">${rows.map(card).join('')}</ul>`;
  };

  async function load() {
    listEl.innerHTML = '<p class="py-10 text-center text-sm text-slate-400">Memuat…</p>';
    const { data, error } = await supabase
      .from('departments')
      .select('id, name, employees(count)')
      .eq('leader_id', leaderId)
      .order('name');
    if (error) {
      console.error(error);
      listEl.innerHTML = errBox('Gagal memuat daftar bagian.');
      return;
    }
    rows = data ?? [];
    renderList();
  }

  function openFormModal(dept) {
    const editing = !!dept;
    openModal({
      title: editing ? 'Ubah bagian' : 'Tambah bagian',
      content: `
        <form id="dept-form" novalidate class="space-y-4">
          <div>
            <label for="f-dname" class="${LABEL}">Nama bagian</label>
            <input id="f-dname" name="name" type="text" maxlength="60" autocomplete="off"
                   value="${esc(dept?.name ?? '')}" placeholder="Contoh: Gudang" class="${INPUT}">
          </div>
          <p data-error role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <button type="submit" class="${SUBMIT_CLS}">${editing ? 'Simpan' : 'Tambah bagian'}</button>
        </form>`,
      onMount: (body, close) => {
        const form = body.querySelector('#dept-form');
        const errEl = body.querySelector('[data-error]');
        const btn = form.querySelector('[type="submit"]');
        const label = btn.textContent;
        const setError = (m) => { errEl.textContent = m; errEl.classList.toggle('hidden', !m); };

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (btn.disabled) return;
          const name = form.elements.name.value.trim().replace(/\s+/g, ' ');
          if (!name) return setError('Nama bagian wajib diisi.');

          setError('');
          btn.disabled = true;
          btn.textContent = 'Memproses…';
          const res = editing
            ? await supabase.from('departments').update({ name }).eq('id', dept.id).select('id')
            : await supabase.from('departments').insert({ leader_id: leaderId, name });
          if (res.error || (editing && !(res.data && res.data.length))) {
            console.error(res.error);
            btn.disabled = false;
            btn.textContent = label;
            setError(dbMessage(res.error, DEPT_ERR));
            return;
          }
          close();
          toast(editing ? 'Bagian diperbarui.' : 'Bagian ditambahkan.', 'success');
          load();
        });
      },
    });
  }

  async function removeDept(dept) {
    const ok = await confirmDialog({
      title: 'Hapus bagian?',
      message: `Bagian "${dept.name}" akan dihapus permanen.`,
      confirmLabel: 'Hapus',
      danger: true,
    });
    if (!ok) return;
    const { data, error } = await supabase.from('departments').delete().eq('id', dept.id).select('id');
    if (error || !data || data.length === 0) {
      console.error(error);
      toast(dbMessage(error, DEPT_ERR), 'error');
      return;
    }
    toast('Bagian dihapus.', 'success');
    load();
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'retry') return load();
    const dept = rows.find((d) => d.id === btn.dataset.id);
    if (!dept) return;
    if (btn.dataset.act === 'edit') openFormModal(dept);
    else if (btn.dataset.act === 'delete') removeDept(dept);
  });
  view.querySelector('#btn-add').addEventListener('click', () => openFormModal(null));

  await load();
}

// --- Karyawan (leader): data master karyawan ---
const EMP_ERR = {
  '23505': 'NIP sudah dipakai karyawan lain.',
  '23503': 'Bagian tidak valid.',
  '42501': 'Bagian tidak valid atau akses ditolak.',
};

async function pageKaryawan(view, ctx) {
  const leaderId = ctx.profile.id;
  let depts = [];
  let emps = [];
  const f = { q: '', dept: '', status: 'aktif' };

  view.innerHTML = '<div id="k-body" class="mx-auto max-w-5xl"></div>';
  const body = view.querySelector('#k-body');

  const deptOptions = (selected) =>
    depts.map((d) => `<option value="${esc(d.id)}"${d.id === selected ? ' selected' : ''}>${esc(d.name)}</option>`).join('');

  const matches = (e, q) =>
    !q || e.full_name.toLowerCase().includes(q) || (e.nip ?? '').toLowerCase().includes(q);
  const statusOk = (e) => f.status === 'semua' || (f.status === 'aktif') === e.is_active;

  // Di HP kolom NIP dan Bagian disembunyikan, isinya pindah jadi sub-baris di bawah nama.
  const row = (e, i, deptName) => `
    <tr class="hover:bg-slate-50">
      <td class="hidden w-12 px-4 py-3 text-slate-400 md:table-cell">${i + 1}</td>
      <td class="px-4 py-3">
        <p class="break-words font-medium text-slate-900">${esc(e.full_name)}</p>
        <p class="mt-0.5 break-words text-xs text-slate-500 md:hidden">${e.nip ? esc(e.nip) + ' · ' : ''}${esc(deptName ?? '—')}</p>
      </td>
      <td class="hidden px-4 py-3 text-slate-600 md:table-cell">${e.nip ? esc(e.nip) : '—'}</td>
      <td class="hidden px-4 py-3 text-slate-600 md:table-cell">${esc(deptName ?? '—')}</td>
      <td class="px-4 py-3">
        <span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium ${e.is_active ? BADGE_ON : BADGE_OFF}">${e.is_active ? 'Aktif' : 'Nonaktif'}</span>
      </td>
      <td class="px-4 py-3">
        <div class="flex flex-col items-end gap-1.5 md:flex-row md:justify-end md:gap-2">
          <button type="button" data-act="edit" data-id="${esc(e.id)}" class="${BTN_SM} whitespace-nowrap">Ubah</button>
          <button type="button" data-act="toggle" data-id="${esc(e.id)}" class="${BTN_SM} whitespace-nowrap">${e.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
        </div>
      </td>
    </tr>`;

  const chip = (id, label, count, active) => `
    <button type="button" data-dept="${esc(id)}" aria-pressed="${active}"
            class="shrink-0 whitespace-nowrap rounded-full border px-3 py-1.5 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ${active ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50'}">${esc(label)} <span class="${active ? 'text-indigo-100' : 'text-slate-400'}">${count}</span></button>`;

  function renderList() {
    const q = f.q.trim().toLowerCase();
    const names = new Map(depts.map((d) => [d.id, d.name]));

    // Jumlah di chip mengikuti pencarian + status, supaya kelihatan sebaran per bagian
    const base = emps.filter((e) => statusOk(e) && matches(e, q));
    const counts = new Map();
    base.forEach((e) => counts.set(e.department_id, (counts.get(e.department_id) ?? 0) + 1));
    body.querySelector('#k-chips').innerHTML =
      chip('', 'Semua', base.length, !f.dept) +
      depts.map((d) => chip(d.id, d.name, counts.get(d.id) ?? 0, f.dept === d.id)).join('');

    const list = f.dept ? base.filter((e) => e.department_id === f.dept) : base;
    body.querySelector('#k-count').textContent = `${list.length} karyawan`;

    const listEl = body.querySelector('#k-list');
    if (!list.length) {
      listEl.innerHTML = `
        <div class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center">
          <p class="text-sm font-medium text-slate-900">${emps.length ? 'Tidak ada yang cocok' : 'Belum ada karyawan'}</p>
          <p class="mt-1 text-sm text-slate-500">${emps.length ? 'Ubah kata kunci atau filter.' : 'Klik Tambah untuk menambah karyawan pertama.'}</p>
        </div>`;
      return;
    }
    listEl.innerHTML = `
      <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-left text-xs font-medium uppercase tracking-wide text-slate-500">
              <tr>
                <th scope="col" class="hidden w-12 px-4 py-3 md:table-cell">No</th>
                <th scope="col" class="px-4 py-3">Nama</th>
                <th scope="col" class="hidden px-4 py-3 md:table-cell">NIP</th>
                <th scope="col" class="hidden px-4 py-3 md:table-cell">Bagian</th>
                <th scope="col" class="px-4 py-3">Status</th>
                <th scope="col" class="px-4 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">${list.map((e, i) => row(e, i, names.get(e.department_id))).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  async function load() {
    body.innerHTML = '<p class="py-10 text-center text-sm text-slate-400">Memuat…</p>';
    const [d, e] = await Promise.all([
      supabase.from('departments').select('id, name').eq('leader_id', leaderId).order('name'),
      supabase.from('employees').select('id, nip, full_name, is_active, department_id').eq('leader_id', leaderId).order('full_name'),
    ]);
    if (d.error || e.error) {
      console.error(d.error || e.error);
      body.innerHTML = errBox('Gagal memuat data karyawan.');
      body.querySelector('[data-act="retry"]').addEventListener('click', load);
      return;
    }
    depts = d.data ?? [];
    emps = e.data ?? [];

    if (!depts.length) {
      body.innerHTML = `
        <div class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center">
          <p class="text-sm font-medium text-slate-900">Belum ada bagian</p>
          <p class="mt-1 text-sm text-slate-500">Buat bagian dulu supaya karyawan bisa ditempatkan.</p>
          <a href="#/bagian" class="${BTN_PRIMARY} mt-4 inline-block">Ke menu Bagian</a>
        </div>`;
      return;
    }

    body.innerHTML = `
      <div class="mb-4 space-y-3">
        <div class="flex gap-2">
          <input id="k-q" type="search" placeholder="Cari nama atau NIP" autocomplete="off" value="${esc(f.q)}" class="${INPUT}">
          <button type="button" id="k-add" class="${BTN_PRIMARY} flex shrink-0 items-center gap-1.5">${icon('plus', 'size-4')}Tambah</button>
        </div>
        <div id="k-chips" role="group" aria-label="Filter bagian"
             class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1 md:mx-0 md:flex-wrap md:overflow-visible md:px-0"></div>
        <div class="flex items-center justify-between gap-3">
          <p id="k-count" class="text-xs text-slate-500"></p>
          <div class="w-40">
            <select id="k-status" aria-label="Filter status" class="${INPUT}">
              <option value="aktif"${f.status === 'aktif' ? ' selected' : ''}>Aktif</option>
              <option value="nonaktif"${f.status === 'nonaktif' ? ' selected' : ''}>Nonaktif</option>
              <option value="semua"${f.status === 'semua' ? ' selected' : ''}>Semua status</option>
            </select>
          </div>
        </div>
      </div>
      <div id="k-list" aria-live="polite"></div>`;

    body.querySelector('#k-q').addEventListener('input', (ev) => { f.q = ev.target.value; renderList(); });
    body.querySelector('#k-status').addEventListener('change', (ev) => { f.status = ev.target.value; renderList(); });
    body.querySelector('#k-chips').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-dept]');
      if (!b) return;
      f.dept = b.dataset.dept;
      renderList();
    });
    body.querySelector('#k-add').addEventListener('click', () => openFormModal(null));
    body.querySelector('#k-list').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-act]');
      if (!btn) return;
      const emp = emps.find((x) => x.id === btn.dataset.id);
      if (!emp) return;
      if (btn.dataset.act === 'edit') openFormModal(emp);
      else if (btn.dataset.act === 'toggle') toggleActive(emp);
    });
    renderList();
  }

  function openFormModal(emp) {
    const editing = !!emp;
    openModal({
      title: editing ? 'Ubah karyawan' : 'Tambah karyawan',
      content: `
        <form id="emp-form" novalidate class="space-y-4">
          <div>
            <label for="f-ename" class="${LABEL}">Nama lengkap</label>
            <input id="f-ename" name="full_name" type="text" maxlength="100" autocomplete="off" value="${esc(emp?.full_name ?? '')}" class="${INPUT}">
          </div>
          <div>
            <label for="f-nip" class="${LABEL}">NIP <span class="font-normal text-slate-400">(opsional)</span></label>
            <input id="f-nip" name="nip" type="text" maxlength="30" autocomplete="off" value="${esc(emp?.nip ?? '')}" class="${INPUT}">
          </div>
          <div>
            <label for="f-edept" class="${LABEL}">Bagian</label>
            <select id="f-edept" name="department_id" class="${INPUT}">
              <option value="">Pilih bagian…</option>${deptOptions(emp?.department_id)}
            </select>
          </div>
          <p data-error role="alert" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <button type="submit" class="${SUBMIT_CLS}">${editing ? 'Simpan' : 'Tambah karyawan'}</button>
        </form>`,
      onMount: (mbody, close) => {
        const form = mbody.querySelector('#emp-form');
        const errEl = mbody.querySelector('[data-error]');
        const btn = form.querySelector('[type="submit"]');
        const label = btn.textContent;
        const setError = (m) => { errEl.textContent = m; errEl.classList.toggle('hidden', !m); };

        form.addEventListener('submit', async (ev) => {
          ev.preventDefault();
          if (btn.disabled) return;
          const full_name = form.elements.full_name.value.trim().replace(/\s+/g, ' ');
          const nip = form.elements.nip.value.trim();
          const department_id = form.elements.department_id.value;

          if (!full_name) return setError('Nama wajib diisi.');
          if (!department_id) return setError('Pilih bagian terlebih dahulu.');

          setError('');
          btn.disabled = true;
          btn.textContent = 'Memproses…';
          const payload = { full_name, nip: nip || null, department_id };
          const res = editing
            ? await supabase.from('employees').update(payload).eq('id', emp.id).select('id')
            : await supabase.from('employees').insert({ ...payload, leader_id: leaderId });
          if (res.error || (editing && !(res.data && res.data.length))) {
            console.error(res.error);
            btn.disabled = false;
            btn.textContent = label;
            setError(dbMessage(res.error, EMP_ERR));
            return;
          }
          close();
          toast(editing ? 'Karyawan diperbarui.' : 'Karyawan ditambahkan.', 'success');
          load();
        });
      },
    });
  }

  // Soft delete: riwayat absensi tetap utuh
  async function toggleActive(emp) {
    const next = !emp.is_active;
    const ok = await confirmDialog({
      title: next ? 'Aktifkan karyawan?' : 'Nonaktifkan karyawan?',
      message: next
        ? `${emp.full_name} akan muncul lagi di daftar absensi.`
        : `${emp.full_name} tidak muncul lagi di daftar absensi. Riwayat absensinya tetap tersimpan.`,
      confirmLabel: next ? 'Aktifkan' : 'Nonaktifkan',
      danger: !next,
    });
    if (!ok) return;
    const { data, error } = await supabase.from('employees').update({ is_active: next }).eq('id', emp.id).select('id');
    if (error || !data || data.length === 0) {
      console.error(error);
      toast('Gagal mengubah status.', 'error');
      return;
    }
    emp.is_active = next;
    renderList();
    toast(next ? 'Karyawan diaktifkan.' : 'Karyawan dinonaktifkan.', 'success');
  }

  await load();
}

/* ============================== 7. LAYOUT ============================== */
// Mobile: header atas + bottom nav. Desktop (md+): sidebar kiri.
const ROLE_LABEL = { super_admin: 'Super Admin', leader: 'Leader' };
const SIDE_ON = ['bg-indigo-50', 'text-indigo-700'];
const SIDE_OFF = ['text-slate-600', 'hover:bg-slate-50', 'hover:text-slate-900'];
const BOTTOM_ON = ['text-indigo-600'];
const BOTTOM_OFF = ['text-slate-500'];

const initials = (name) =>
  String(name ?? '')
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w[0]?.toUpperCase() ?? '')
    .join('') || '?';

function paintNav(el, on, onCls, offCls) {
  el.classList.remove(...(on ? offCls : onCls));
  el.classList.add(...(on ? onCls : offCls));
  if (on) el.setAttribute('aria-current', 'page');
  else el.removeAttribute('aria-current');
}

function renderShell(root, { profile, items, onLogout }) {
  const name = esc(profile.full_name);
  const role = esc(ROLE_LABEL[profile.role] ?? profile.role);
  const ini = esc(initials(profile.full_name));

  const sideLinks = items
    .map(
      (i) => `
      <a href="#${i.path}" data-path="${i.path}"
         class="side-link flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium ${SIDE_OFF.join(' ')}">
        ${icon(i.icon, 'size-5')}<span>${esc(i.label)}</span>
      </a>`,
    )
    .join('');

  const bottomLinks = items
    .map(
      (i) => `
      <a href="#${i.path}" data-path="${i.path}"
         class="bottom-link flex flex-col items-center gap-0.5 px-1 py-2 text-[11px] font-medium ${BOTTOM_OFF.join(' ')}">
        ${icon(i.icon, 'size-6')}<span class="max-w-full truncate">${esc(i.label)}</span>
      </a>`,
    )
    .join('');

  root.innerHTML = `
    <div class="min-h-[100dvh] md:flex">
      <aside class="hidden border-r border-slate-200 bg-white md:fixed md:inset-y-0 md:flex md:w-64 md:flex-col">
        <div class="flex h-16 items-center gap-3 border-b border-slate-100 px-5">
          <div class="flex size-8 items-center justify-center rounded-lg bg-indigo-600 text-white">${icon('check', 'size-5')}</div>
          <span class="text-sm font-semibold text-slate-900">Absensi Karyawan</span>
        </div>
        <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4" aria-label="Menu utama">${sideLinks}</nav>
        <div class="border-t border-slate-100 p-3">
          <div class="flex items-center gap-3 rounded-lg px-2 py-2">
            <div class="flex size-9 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xs font-semibold text-slate-600">${ini}</div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium text-slate-900">${name}</p>
              <p class="truncate text-xs text-slate-500">${role}</p>
            </div>
            <button type="button" data-logout aria-label="Keluar" title="Keluar"
                    class="rounded-lg p-2 text-slate-400 hover:bg-slate-50 hover:text-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
              ${icon('logout', 'size-5')}
            </button>
          </div>
        </div>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col md:pl-64">
        <header class="sticky top-0 z-20 flex h-14 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur md:px-8">
          <h1 id="page-title" class="truncate text-base font-semibold text-slate-900"></h1>
          <div class="flex items-center gap-1 md:hidden">
            <div class="mr-1 text-right leading-tight">
              <p class="max-w-[8rem] truncate text-xs font-medium text-slate-900">${name}</p>
              <p class="text-[11px] text-slate-500">${role}</p>
            </div>
            <button type="button" data-logout aria-label="Keluar"
                    class="rounded-lg p-2 text-slate-500 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
              ${icon('logout', 'size-5')}
            </button>
          </div>
        </header>

        <main id="view" tabindex="-1" class="flex-1 px-4 py-5 pb-28 focus:outline-none md:px-8 md:py-8 md:pb-8"></main>
      </div>

      <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] md:hidden" aria-label="Menu utama">
        <div class="grid" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">${bottomLinks}</div>
      </nav>
    </div>`;

  root.querySelectorAll('[data-logout]').forEach((b) => b.addEventListener('click', onLogout));

  const titleEl = root.querySelector('#page-title');
  const sideEls = [...root.querySelectorAll('.side-link')];
  const bottomEls = [...root.querySelectorAll('.bottom-link')];

  function setActive(item) {
    titleEl.textContent = item.label;
    document.title = `${item.label} · Absensi Karyawan`;
    sideEls.forEach((el) => paintNav(el, el.dataset.path === item.path, SIDE_ON, SIDE_OFF));
    bottomEls.forEach((el) => paintNav(el, el.dataset.path === item.path, BOTTOM_ON, BOTTOM_OFF));
  }

  return { view: root.querySelector('#view'), setActive };
}

/* ============================== 8. ROUTES ============================== */
// Satu sumber untuk menu + route per role. Urutan = urutan menu; yang pertama = halaman default.
// Akses data yang sebenarnya tetap dijaga RLS di database, ini hanya mengatur tampilan.
const ROUTES = {
  leader: [
    { path: '/absensi', label: 'Absensi', icon: 'check', render: stubPage('Absensi', 'Input absensi harian anggota tim.') },
    { path: '/karyawan', label: 'Karyawan', icon: 'user', render: pageKaryawan },
    { path: '/bagian', label: 'Bagian', icon: 'grid', render: pageBagian },
    { path: '/report', label: 'Report', icon: 'chart', render: stubPage('Report', 'Report absensi bulanan, export Excel dan PDF.') },
    { path: '/pengaturan', label: 'Pengaturan', icon: 'sliders', render: stubPage('Pengaturan', 'Jam kerja dan toleransi keterlambatan.') },
  ],
  super_admin: [
    { path: '/leader', label: 'Leader', icon: 'users', render: pageLeader },
    { path: '/report', label: 'Report', icon: 'chart', render: stubPage('Report', 'Report absensi lintas leader.') },
    { path: '/libur', label: 'Hari Libur', icon: 'calendar', render: stubPage('Hari Libur', 'Libur nasional dan cuti bersama.') },
  ],
};
const routesFor = (role) => ROUTES[role] ?? [];

/* ============================ 9. APP + MAIN ============================ */
const root = document.getElementById('app');
let loginNotice = '';

function showLogin() {
  stopRouter();
  document.title = 'Masuk · Absensi Karyawan';
  history.replaceState(null, '', location.pathname + location.search); // buang hash lama
  renderLogin(root, { notice: loginNotice, onLoggedIn: boot });
}

async function boot() {
  loginNotice = '';

  let result;
  try {
    result = await loadSession();
  } catch (e) {
    console.error(e);
    showError(root, {
      message: 'Data akun gagal dimuat. Periksa koneksi internet lalu coba lagi.',
      onRetry: boot,
      onLogout: () => signOut().finally(showLogin),
    });
    return;
  }

  if (!result.session) return showLogin();

  const { profile } = result;
  const items = profile ? routesFor(profile.role) : [];

  if (!profile || !profile.is_active || items.length === 0) {
    loginNotice = !profile
      ? 'Akun belum terdaftar di aplikasi. Hubungi super admin.'
      : 'Akun tidak aktif. Hubungi super admin.';
    await signOut(); // listener SIGNED_OUT juga menampilkan login + notice
    showLogin();
    return;
  }

  const shell = renderShell(root, { profile, items, onLogout: () => signOut() });
  startRouter({ items, ctx: { profile }, view: shell.view, onNavigate: shell.setActive });
}

async function start() {
  // Jangan panggil method supabase langsung di dalam callback ini (bisa deadlock) -> tunda dengan setTimeout.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') setTimeout(showLogin, 0);
  });
  await boot();
}

const configMissing = (v) => !v || v.includes('ISI_');

if (configMissing(SUPABASE_URL) || configMissing(SUPABASE_ANON_KEY)) {
  showFatal(root, 'Konfigurasi belum diisi', 'Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian CONFIG pada index.html.');
} else {
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });
    await start();
  } catch (e) {
    console.error(e);
    showFatal(root, 'Aplikasi gagal dimuat', 'Periksa koneksi internet, lalu muat ulang halaman.');
  }
}
</script>
